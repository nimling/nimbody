<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Product}} · {{.Title}}</title>
<style>
:root {
  --surface-0: #141413;
  --surface-50: #1c1b19;
  --surface-100: #262420;
  --surface-200: #35322b;
  --surface-600: #b0aea5;
  --surface-900: #f4f2ec;
  --primary: #e88b63;
  --success: #4ade80;
  --danger: #f87171;
  --glass: color-mix(in oklab, var(--surface-100), transparent 34%);
  --glass-border: color-mix(in oklab, var(--surface-900), transparent 88%);
  --glass-sheen: linear-gradient(135deg, color-mix(in oklab, var(--surface-900), transparent 88%) 0%, transparent 42%, transparent 70%, color-mix(in oklab, var(--surface-900), transparent 95%) 100%);
  --glass-shadow: 0 1em 2.5em -1.25em rgb(0 0 0 / 0.6);
  --radius: 0.75rem;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --surface-0: #ffffff;
    --surface-50: #faf9f5;
    --surface-100: #f4f2ec;
    --surface-200: #e8e6dc;
    --surface-600: #6b665a;
    --surface-900: #2a2720;
    --primary: #d97757;
    --success: #059669;
    --danger: #dc2626;
    --glass: color-mix(in oklab, var(--surface-0), transparent 34%);
    --glass-border: color-mix(in oklab, var(--surface-900), transparent 86%);
    --glass-sheen: linear-gradient(135deg, color-mix(in oklab, var(--surface-0), transparent 55%) 0%, transparent 45%, transparent 75%, color-mix(in oklab, var(--surface-0), transparent 80%) 100%);
    --glass-shadow: 0 0.75em 2em -1em color-mix(in oklab, var(--surface-900), transparent 82%);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-block-size: 100%; }
body {
  min-block-size: 100vh;
  display: grid;
  place-items: center;
  padding: 1.5rem;
  font: 400 0.9375rem/1.55 "Inter", system-ui, sans-serif;
  color: var(--surface-900);
  background:
    radial-gradient(55% 45% at 18% 8%, color-mix(in oklab, var(--primary) 20%, transparent), transparent 70%),
    radial-gradient(45% 40% at 88% 92%, color-mix(in oklab, var(--primary) 12%, transparent), transparent 70%),
    var(--surface-0);
}
.card {
  position: relative;
  overflow: hidden;
  inline-size: min(100%, 27rem);
  display: grid;
  gap: 1.5rem;
  padding: 1.5rem 1.75rem 1.75rem;
  border-radius: calc(var(--radius) * 1.5);
  background: var(--glass);
  -webkit-backdrop-filter: blur(0.75em) saturate(1.3);
  backdrop-filter: blur(0.75em) saturate(1.3);
  box-shadow: inset 0 0 0 1px var(--glass-border), var(--glass-shadow);
  animation: rise 320ms ease-out backwards;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: var(--glass-sheen);
}
.card > * { position: relative; }
.brand { display: flex; align-items: center; gap: 0.625rem; }
.brand-mark {
  inline-size: 2rem;
  block-size: 2rem;
  display: grid;
  place-items: center;
  border-radius: 0.5rem;
  font-weight: 700;
  color: var(--surface-0);
  background: var(--primary);
  box-shadow: 0 0.5em 1.25em -0.5em color-mix(in oklab, var(--primary), transparent 30%);
}
.brand-name { font-weight: 600; letter-spacing: -0.015em; }
.cli {
  margin-inline-start: auto;
  padding: 0.125rem 0.625rem;
  border-radius: 999px;
  font: 500 0.75rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--surface-600);
  background: color-mix(in oklab, var(--surface-200), transparent 40%);
  box-shadow: inset 0 0 0 1px var(--glass-border);
}
.state { display: grid; justify-items: center; gap: 0.75rem; text-align: center; padding-block: 0.5rem 0.25rem; }
.mark {
  inline-size: 3.5rem;
  block-size: 3.5rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--success);
  background: color-mix(in oklab, var(--success), transparent 86%);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--success), transparent 60%);
  animation: pop 420ms 120ms cubic-bezier(0.2, 0.9, 0.3, 1.3) backwards;
}
.failed .mark {
  color: var(--danger);
  background: color-mix(in oklab, var(--danger), transparent 86%);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--danger), transparent 60%);
}
.mark svg { inline-size: 1.625rem; block-size: 1.625rem; }
.mark path { fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; animation: draw 360ms 360ms ease-out backwards; }
h1 { margin: 0; font-size: 1.375rem; font-weight: 600; letter-spacing: -0.025em; }
p { margin: 0; color: var(--surface-600); max-inline-size: 22rem; }
@keyframes rise { from { opacity: 0; transform: translateY(0.5rem) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
@keyframes draw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
<main class="card{{if .Failed}} failed{{end}}">
  <header class="brand">
    <span class="brand-mark" aria-hidden="true">{{.GetMark}}</span>
    <span class="brand-name">{{.Product}}</span>
    <span class="cli">{{.Name}}</span>
  </header>
  <section class="state">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">{{if .Failed}}<path d="M7 7l10 10M17 7L7 17"/>{{else}}<path d="M5 12.5l4.5 4.5L19 7.5"/>{{end}}</svg>
    </div>
    <h1>{{.Title}}</h1>
    <p>{{.Message}}</p>
  </section>
</main>
</body>
</html>
